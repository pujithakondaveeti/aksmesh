---
# Example: Default Deny All Ingress Policy for ss-automative-nds
# This policy will propagate to all child namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ss-automative-nds
  labels:
    propagate.hnc.x-k8s.io/treeSelect: "true"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Example: Allow traffic within the same namespace hierarchy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: ss-automative-nds
  labels:
    propagate.hnc.x-k8s.io/treeSelect: "true"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
# Example: Allow traffic from Istio ingress gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-ingress
  namespace: ss-automative-nds
  labels:
    propagate.hnc.x-k8s.io/treeSelect: "true"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: aks-istio-ingress
---
# Example: Allow traffic from monitoring namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring
  namespace: ss-automative-nds
  labels:
    propagate.hnc.x-k8s.io/treeSelect: "true"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9090
